        - locale
        - verseReference
        - verseText
        - verseAuthor
        - feastTitle
        - feastDescription
        - readingTitle
        - readingReference
        - readingDurationMinutes
        - publicationStatus
        - createdAt
        - updatedAt
    AdminDailyContentInput:
