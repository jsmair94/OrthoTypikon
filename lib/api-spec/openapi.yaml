      required:
        - date
        - canonicalDate
        - calendarType
        - locale
        - verse
        - feast
        - saints
        - fasting
        - relatedReading
    SynaxarionHomepagePayload:
      type: object
      additionalProperties: false
      properties:
        sourceUrl:
          type: string
        modifiedAt:
          type:
            - string
            - "null"
          format: date-time
        dateLabel:
          type: string
        liturgicalLabel:
          type: string
        commemorations:
          type: string
        verse:
          type: object
          additionalProperties: false
          properties:
            text:
              type: string
            reference:
              type:
                - string
                - "null"
          required:
            - text
            - reference
        saintImageUrl:
          type: string
        gospelUrl:
          type:
            - string
            - "null"
        calendarUrl:
          type:
            - string
            - "null"
      required:
        - sourceUrl
        - modifiedAt
        - dateLabel
        - liturgicalLabel
        - commemorations
        - verse
        - saintImageUrl
        - gospelUrl
        - calendarUrl
    CalendarEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        date:
          type: string
        canonicalDate:
          type: string
        calendarType:
          $ref: "#/components/schemas/CalendarType"
        locale:
          $ref: "#/components/schemas/Locale"
        feast:
          oneOf:
            - $ref: "#/components/schemas/Feast"
            - type: "null"
        fastingTitle:
          type:
            - string
            - "null"
        liturgy:
          type:
            - string
            - "null"
        color:
          type:
            - string
            - "null"
        saints:
          type: array
          items:
            $ref: "#/components/schemas/SaintSummary"
      required:
        - id
        - date
        - canonicalDate
        - calendarType
        - locale
        - feast
        - fastingTitle
        - liturgy
        - color
        - saints
    Recipe:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        time:
          type: string
        level:
          $ref: "#/components/schemas/FastLevel"
        ingredients:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - subtitle
        - time
        - level
        - ingredients
        - steps
    FastingDay:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
        canonicalDate:
          type: string
        calendarType:
          $ref: "#/components/schemas/CalendarType"
        locale:
          $ref: "#/components/schemas/Locale"
        level:
          $ref: "#/components/schemas/FastLevel"
        title:
          type: string
        description:
          type: string
        note:
          type:
            - string
            - "null"
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
      required:
        - date
        - canonicalDate
        - calendarType
        - locale
        - level
        - title
        - description
        - note
        - recipes
    Pagination:
      type: object
      properties:
        page:
          type: number
          multipleOf: 1
        limit:
          type: number
          multipleOf: 1
        total:
          type: number
          multipleOf: 1
        hasMore:
          type: boolean
      required:
        - page
        - limit
        - total
        - hasMore
    PaginatedSaints:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaintSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
    LearningEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/LearningCategory"
        title:
          type: string
        alternate:
          type:
            - string
            - "null"
        pronunciation:
          type:
            - string
            - "null"
        definition:
          type: string
        body:
          type:
            - string
            - "null"
      required:
