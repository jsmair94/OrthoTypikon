          multipleOf: 1
        archived:
          type: number
          multipleOf: 1
      required:
        - total
        - published
        - draft
        - archived
    AdminOverview:
      type: object
      additionalProperties: false
      properties:
        dailyContent:
          $ref: "#/components/schemas/AdminContentCounts"
        calendarEntries:
          $ref: "#/components/schemas/AdminContentCounts"
        saints:
          $ref: "#/components/schemas/AdminContentCounts"
        fastingGuidance:
          $ref: "#/components/schemas/AdminContentCounts"
        fastingRecipes:
          $ref: "#/components/schemas/AdminContentCounts"
        learningEntries:
          $ref: "#/components/schemas/AdminContentCounts"
        prayerRequestsPending:
