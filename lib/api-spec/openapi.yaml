openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: OrthoTypikon content API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prayer-community
    description: Privacy-first prayer community
  - name: moderation
    description: Pastoral review and moderation
  - name: admin
    description: Authenticated content administration
  - name: daily
    description: Daily spiritual content
  - name: synaxarion
    description: Live Synaxarion card from the Orthodox Jordan homepage
  - name: calendar
    description: Liturgical calendar
  - name: fasting
    description: Fasting guidance and recipes
  - name: saints
    description: Saints and commemorations
  - name: learning
    description: Learning and liturgical dictionary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /prayer-community/session:
    post:
      operationId: createPrayerSession
      tags:
        - prayer-community
      summary: Create an anonymous device session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerSessionCreate"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /prayer-community/requests:
    get:
      operationId: listPrayerRequests
      tags:
        - prayer-community
      summary: List approved community requests or the current user's requests
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - community
              - mine
            default: community
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
      responses:
        "200":
          description: Prayer requests
          content:
            application/json:
              schema:
                type: object
                required:
                  - requests
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrayerRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createPrayerRequest
      tags:
        - prayer-community
      summary: Submit a prayer request for pastoral review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerRequestCreate"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /prayer-community/requests/{requestId}:
    delete:
      operationId: deletePrayerRequest
      tags:
        - prayer-community
      summary: Remove one of the current user's requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /prayer-community/requests/{requestId}/report:
    post:
      operationId: reportPrayerRequest
      tags:
        - prayer-community
      summary: Report a prayer request for pastoral review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerReportCreate"
      responses:
        "204":
          description: Report received
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /moderation/prayer-requests:
    get:
      operationId: listModerationPrayerRequests
      tags:
        - moderation
      summary: List requests awaiting pastoral moderation
      security:
        - moderationKey: []
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                type: object
                required:
                  - requests
                properties:
                  requests:
                    type: array
                    items:
