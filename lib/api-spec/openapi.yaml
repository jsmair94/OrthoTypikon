        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    moderationKey:
      type: apiKey
      in: header
      name: X-Moderation-Key
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: admin-session
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 100
    DatePath:
      name: date
      in: path
      required: true
      description: Calendar date in YYYY-MM-DD format
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    DateQuery:
      name: date
      in: query
      required: false
      description: Calendar date in YYYY-MM-DD format; defaults to today in UTC
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    MonthQuery:
      name: month
      in: query
      required: true
      description: Month in YYYY-MM format
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
    LocaleQuery:
      name: locale
      in: query
      required: false
      description: Content locale
      schema:
        $ref: "#/components/schemas/Locale"
        default: ar
    SynaxarionLocaleQuery:
      name: locale
      in: query
      required: false
      description: Translation locale for the live Synaxarion card
      schema:
        $ref: "#/components/schemas/SynaxarionLocale"
        default: ar
    CalendarTypeQuery:
      name: calendarType
      in: query
      required: false
      description: Calendar used for the requested date
      schema:
        $ref: "#/components/schemas/CalendarType"
        default: gregorian
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    LearningCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/LearningCategory"
    SaintIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9-]{1,120}$
    AdminContentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AdminLocaleQuery:
      name: locale
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Locale"
    AdminPublicationStatusQuery:
      name: publicationStatus
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PublicationStatus"
    AdminSearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    AdminPageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    AdminLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Content not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A record with the same unique fields already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DatabaseUnavailable:
      description: Database unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    PrayerSessionCreate:
      type: object
      required:
        - installationId
      properties:
        installationId:
          type: string
          minLength: 32
          maxLength: 128
    PrayerSession:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    PrayerRequestCreate:
      type: object
      required:
        - name
        - category
        - visibility
        - nameVisibility
        - showCategory
        - showDuration
        - durationDays
        - consent
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          enum:
            - sick
            - departed
            - thanksgiving
            - other
        visibility:
          type: string
          enum:
            - community
            - private
        nameVisibility:
          type: string
          enum:
            - named
            - anonymous
        showCategory:
          type: boolean
        showDuration:
          type: boolean
        durationDays:
          type: integer
          enum:
            - 1
            - 7
            - 30
            - 90
        consent:
          type: boolean
          enum:
            - true
    PrayerRequest:
      type: object
      required:
        - id
        - name
        - visibility
        - nameVisibility
        - showCategory
        - showDuration
        - status
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
            - sick
            - departed
            - thanksgiving
            - other
        visibility:
          type: string
          enum:
            - community
            - private
        nameVisibility:
          type: string
          enum:
            - named
            - anonymous
        showCategory:
          type: boolean
        showDuration:
          type: boolean
        durationDays:
          type: integer
          enum:
            - 1
            - 7
            - 30
            - 90
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - hidden
            - removed
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PrayerReportCreate:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PrayerReview:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
            - hidden
    ApiError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Locale:
      type: string
      enum:
        - ar
        - en
        - fr
    PublicationStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    SynaxarionLocale:
      type: string
      enum:
        - ar
        - en
        - el
    CalendarType:
      type: string
      enum:
        - gregorian
        - julian
    LearningCategory:
      type: string
      enum:
        - audio
        - icon
        - dictionary
    FastLevel:
      type: string
      enum:
        - strict
        - oil
        - fish
        - none
    Problem:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - DATABASE_UNAVAILABLE
            - INTERNAL_ERROR
      required:
        - error
        - code
    SaintSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        shortBio:
          type: string
      required:
        - id
        - name
        - shortBio
    Saint:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        shortBio:
          type: string
        feastDate:
          type:
            - string
            - "null"
        audioText:
          type: string
      required:
        - id
        - name
        - shortBio
        - feastDate
        - audioText
    Feast:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type:
            - string
            - "null"
      required:
        - title
        - description
    Reading:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        reference:
          type:
            - string
            - "null"
        durationMinutes:
          type:
            - number
            - "null"
          multipleOf: 1
      required:
        - title
        - reference
        - durationMinutes
    Verse:
      type: object
      additionalProperties: false
      properties:
        reference:
          type: string
        text:
          type: string
        author:
          type: string
      required:
        - reference
        - text
        - author
    FastingSummary:
      type: object
      additionalProperties: false
      properties:
        level:
          $ref: "#/components/schemas/FastLevel"
        title:
          type: string
      required:
        - level
        - title
    DailyHomePayload:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
        canonicalDate:
          type: string
        calendarType:
          $ref: "#/components/schemas/CalendarType"
        locale:
          $ref: "#/components/schemas/Locale"
        verse:
          $ref: "#/components/schemas/Verse"
        feast:
          oneOf:
            - $ref: "#/components/schemas/Feast"
            - type: "null"
        saints:
          type: array
          items:
            $ref: "#/components/schemas/SaintSummary"
        fasting:
          oneOf:
            - $ref: "#/components/schemas/FastingSummary"
            - type: "null"
        relatedReading:
