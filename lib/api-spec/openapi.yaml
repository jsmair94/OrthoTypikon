      parameters:
        - $ref: "#/components/parameters/DatePath"
        - $ref: "#/components/parameters/LocaleQuery"
        - $ref: "#/components/parameters/CalendarTypeQuery"
      responses:
        "200":
          description: Fasting guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastingDay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
