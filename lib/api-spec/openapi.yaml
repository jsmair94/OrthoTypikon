        readingReference:
          type: ["string", "null"]
        readingDurationMinutes:
          type: ["number", "null"]
          multipleOf: 1
        publicationStatus:
          $ref: "#/components/schemas/PublicationStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
