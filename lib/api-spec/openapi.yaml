        - $ref: "#/components/parameters/DatePath"
        - $ref: "#/components/parameters/LocaleQuery"
        - $ref: "#/components/parameters/CalendarTypeQuery"
      responses:
        "200":
          description: Calendar entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /fasting/{date}:
    get:
      operationId: getFastingByDate
