kind = "mobile"
previewPath = "/"
title = "OrthoTypikon"
description = "تطبيق أرثوذكسي عربي يجمع الرزنامة الليتورجية، القديسين، الصلوات، الإنجيل المقروء والمسموع، الأخبار، وآية اليوم في تجربة روحية يومية."
version = "1.0.0"
id = "artifacts/orthotypikon"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19442

[services.development]
run = "pnpm --filter @workspace/orthotypikon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orthotypikon", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orthotypikon", "run", "serve" ]

[services.env]
PORT = "19442"
BASE_PATH = "/"
